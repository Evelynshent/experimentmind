[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentmind"
version = "0.2.0"
description = "Trust-separated experiment investigation and decision reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openai>=1.40",
    "pydantic>=2.8",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.scripts]
experimentmind = "experimentmind.demo:main"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["live_api: makes an explicitly authorized OpenAI API request"]
testpaths = ["tests"]
